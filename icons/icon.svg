  <path transform="translate(670 548) scale(6.4) translate(-12 -11.5)" d="M12 2.6l2.83 5.9 6.47.82-4.75 4.47 1.2 6.42L12 17.1l-5.75 3.11 1.2-6.42L2.7 9.32l6.47-.82z" fill="#C98F2E" stroke="#B47D22" stroke-width=".6" stroke-linejoin="round"/>
  <!-- ribbon -->
  <path d="M556 392 L 556 820 L 580 796 L 604 820 L 604 372 C 588 376, 572 383, 556 392 Z" fill="#6A6B3C"/>
  <path d="M556 392 L 556 820 L 566 810 L 566 386 Z" fill="#000" opacity=".12"/>
