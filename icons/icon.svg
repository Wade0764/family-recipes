    <!-- right page -->
    <path d="M512 400 C 592 350, 722 338, 828 364 L 828 716 C 722 690, 592 700, 512 742 Z" fill="url(#pageR)"/>
  </g>
  <!-- spine shade -->
  <path d="M512 400 L 512 742" stroke="#D9C6A8" stroke-width="4"/>
  <!-- text lines left -->
  <g stroke="#C9A98A" stroke-width="9" stroke-linecap="round" opacity=".7" fill="none">
    <path d="M262 452 C 330 440, 400 446, 452 466"/>
    <path d="M262 508 C 330 496, 400 502, 452 522"/>
    <path d="M262 564 C 330 552, 400 558, 452 578"/>
    <path d="M262 620 C 310 611, 350 613, 384 620"/>
