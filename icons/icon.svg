    <path d="M512 742 C 430 700, 300 690, 196 716 L 196 742 C 300 716, 430 726, 512 770 C 594 726, 724 716, 828 742 L 828 716 C 724 690, 594 700, 512 742 Z" fill="#E2D2B8"/>
