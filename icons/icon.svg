<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="28%" r="85%">
      <stop offset="0" stop-color="#C4664A"/>
      <stop offset=".6" stop-color="#AD4D36"/>
      <stop offset="1" stop-color="#8C3B29"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" x2="1">
      <stop offset="0" stop-color="#FBF5EA"/><stop offset="1" stop-color="#EFE3CF"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" x2="0">
      <stop offset="0" stop-color="#FBF5EA"/><stop offset="1" stop-color="#EFE3CF"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#4A1E12" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="84" y="84" width="856" height="856" rx="168" fill="none" stroke="#F3E3CF" stroke-opacity=".28" stroke-width="5"/>
  <g transform="translate(512 560) scale(1.12) translate(-512 -590)">
